[project]
name = "broskill"
version = "0.1.0"
description = "Lightweight, quick-loading skill loader for agentic projects — discovers skills (SKILL.md + references/scripts/assets), loads their instructions, and turns their scripts into callable tools."
readme = "README.md"
license = "MIT"
authors = [
    { name = "datanooblol" },
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.urls]
Repository = "https://github.com/datanooblol/broskill"
Changelog = "https://github.com/datanooblol/broskill/blob/main/VERSIONS.md"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/broskill"]

[tool.ruff]
src = ["src/broskill"]
include = ["src/broskill/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
